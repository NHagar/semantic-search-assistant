[project]
name = "semantic-search-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "chromadb>=1.0.15",
  "duckdb>=1.3.2",
  "einops>=0.8.1",
  "flask>=3.1.1",
  "flask-cors>=6.0.1",
  "openai>=1.97.1",
  "paddleocr[doc-parser]>=3.3.2",
  "paddlepaddle-gpu==3.3.0 ; sys_platform != 'darwin'",
  "paddlepaddle==3.3.0 ; sys_platform == 'darwin'",
  "pandas>=2.3.2",
  "pycryptodome>=3.23.0",
  "pypdf2>=3.0.1",
  "ruff>=0.12.7",
  "sentence-transformers>=2.7.0",
  "tiktoken>=0.9.0",
  "transformers>=4.51.0",
]

[[tool.uv.index]]
name = "paddle-cu130"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu130/"
explicit = true

[[tool.uv.index]]
name = "paddle-cpu"
url = "https://www.paddlepaddle.org.cn/packages/stable/cpu/"
explicit = true

[tool.uv.sources]
paddlepaddle = { index = "paddle-cpu" }
paddlepaddle-gpu = { index = "paddle-cu130" }
